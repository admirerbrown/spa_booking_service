name: Supabase keep-alive

on:
  schedule:
    # Every 3 days at 06:00 UTC. Free projects pause after 7 days of inactivity.
    - cron: "0 6 */3 * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the services table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # --fail makes the job fail on any non-2xx response, so GitHub emails you
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/services?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null -w "Supabase responded with HTTP %{http_code}\n"
